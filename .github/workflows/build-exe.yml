name: Build Windows executable

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "algorithms.py"
      - "benchmark.py"
      - "data_generators.py"
      - "visual_sorts.py"
      - ".github/workflows/build-exe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install matplotlib pyinstaller

      - name: Build executable
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name SortingLab --collect-all matplotlib app.py

      - name: Replace executable in repository
        shell: pwsh
        run: |
          Copy-Item "dist/SortingLab.exe" "SortingLab.exe" -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SortingLab.exe
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Обновить SortingLab.exe"
            git push
          } else {
            Write-Host "Executable is already up to date."
          }

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: SortingLab-windows
          path: dist/SortingLab.exe
          if-no-files-found: error
